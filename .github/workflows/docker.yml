name: Docker

# The image is built only for a release: publish a release on GitHub
# with a version tag like v1.2.0. A push to main builds nothing.
on:
  release:
    types: [published]
  # also by hand, from the Actions page: that image gets only its commit as a tag
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.0 gives the tags 1.2.0, 1.2 and latest.
          # A pre-release (v1.3.0-beta.1) gets only its own version, never latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # optional: tell another repository that a new version is out
      # (a GitHub `repository_dispatch` address and a token, both as secrets)
      - name: Notify downstream builds
        env:
          HOOK: ${{ secrets.DOWNSTREAM_DISPATCH_URL }}
          TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        if: env.HOOK != ''
        run: |
          curl -sS -X POST --fail-with-body -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$HOOK" -d '{"event_type":"core-updated"}'
