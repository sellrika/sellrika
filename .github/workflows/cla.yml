name: CLA Assistant

# Asks everyone who opens a pull request to agree to CLA.md, once.
# They agree by writing one comment. The check stays red until they do.
# Who agreed, and when, is kept as a list on the branch cla-signatures.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # the action saves a new name on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/sellrika/sellrika/blob/main/CLA.md
          # the list of signatures: its own branch, so a new name starts no build.
          # A rule on the repository stops anyone from deleting that branch.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          # people and bots that need not sign
          allowlist: necessarylion,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
