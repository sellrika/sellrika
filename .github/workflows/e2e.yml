name: E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Playwright, split in six jobs that run at the same time: each one builds once, then boots and runs only its
# share of the spec files (E2E_SHARD=<i>/<n> is read by e2e/tmp.ts — round-robin over the spec list, so a new
# spec file lands in a shard on its own). Unit tests are in test.yml.
#
# The jobs run inside Microsoft's Playwright image: browsers + every system library are already there, so
# there's nothing to install or cache. The tag MUST match `@playwright/test` in package.json — bump both together.
jobs:
  e2e:
    # The SQLite jobs keep the name "e2e <i>/6": the branch rule of main asks for those names.
    name: e2e ${{ matrix.db == 'mysql' && 'mysql ' || '' }}${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        # every shard runs twice: on SQLite and on MySQL
        db: [sqlite, mysql]
    # The job runs in a container, so the database is reached by its service name.
    # An empty image means "no service": the SQLite jobs start none.
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq unzip >/dev/null # the image has no unzip, which setup-bun needs
      - uses: oven-sh/setup-bun@v2 # the image ships Node, not Bun
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          CI: "1"
          E2E_SHARD: ${{ matrix.shard }}/6
          E2E_MYSQL_URL: ${{ matrix.db == 'mysql' && 'mysql://root:root@mysql:3306' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.db }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
